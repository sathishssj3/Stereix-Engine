# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI - Build, Test, and Analyze

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
    paths-ignore:
      - 'stereix-docs/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'stereix-docs/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
      # Needed for the GitHub CodeQL action
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Decode Release Signing Certificate
      if: matrix.configuration == 'Release' && startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      env:
        CERT_BASE64: ${{ secrets.SIGN_CERT_PATH }}
        CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASS }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
          Write-Host "::warning::Release signing certificate secret (SIGN_CERT_PATH) is not configured in repository secrets. Skipping pre-build signing setup."
          exit 0
        }
        $certPath = Join-Path $env:RUNNER_TEMP 'nexvr-signing.pfx'
        try {
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_BASE64))
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certPath, $env:CERT_PASSWORD)
          $eku = $cert.Extensions | Where-Object { $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } | Select-Object -First 1
          if (-not $cert.HasPrivateKey -or (Get-Date) -lt $cert.NotBefore -or (Get-Date) -gt $cert.NotAfter -or
              -not $eku -or -not @($eku.EnhancedKeyUsages | Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' }).Count) {
            Write-Host "::warning::Invalid code-signing certificate provided. Skipping pre-build signing."
            exit 0
          }
          "SIGN_CERT_PATH=$certPath" >> $env:GITHUB_ENV
          "SIGN_CERT_PASS=$env:CERT_PASSWORD" >> $env:GITHUB_ENV
        } catch {
          Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
          Write-Host "::warning::Release signing certificate is invalid or cannot be decoded: $_"
          exit 0
        }

    - name: Setup MSVC & CMake
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Download Official DXC (SHA-256 Verified)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $expected = '01D4C4DFA37DEE21AFE70CAC510D63001B6B611A128E3760F168765EEAD1E625'
        curl.exe -fsSL https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.7.2308/dxc_2023_08_14.zip -o dxc.zip
        $actual = (Get-FileHash -LiteralPath dxc.zip -Algorithm SHA256).Hash.ToUpperInvariant()
        if ($actual -ne $expected) {
          throw "DXC SHA-256 mismatch! Expected $expected, got $actual"
        }
        7z.exe x dxc.zip -odxc -y

    - name: Cache Vulkan SDK
      id: cache-vulkan
      uses: actions/cache@v4
      with:
        path: C:\VulkanSDK
        key: vulkan-sdk-1.3.296.0-windows

    - name: Setup Vulkan SDK (SHA-256 Verified)
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $VulkanVersion = "1.3.296.0"
        $expected = 'ACB4AE0786FD3E558F8B3C36CC3EBA91638984217BA8A6795EC64D2F9FFD8C4B'
        $VulkanURL = "https://sdk.lunarg.com/sdk/download/$VulkanVersion/windows/VulkanSDK-$VulkanVersion-Installer.exe"
        Write-Host "Downloading Vulkan SDK $VulkanVersion..."
        Invoke-WebRequest -Uri $VulkanURL -OutFile VulkanSDK.exe
        $actual = (Get-FileHash -LiteralPath .\VulkanSDK.exe -Algorithm SHA256).Hash.ToUpperInvariant()
        if ($actual -ne $expected) {
          throw "Vulkan SDK SHA-256 mismatch! Expected $expected, got $actual"
        }
        Write-Host "Installing Vulkan SDK..."
        Start-Process -FilePath ".\VulkanSDK.exe" -ArgumentList "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -NoNewWindow

    - name: Configure Vulkan Environment
      shell: pwsh
      run: |
        echo "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
        echo "C:\VulkanSDK\Bin" >> $env:GITHUB_PATH

    # Only run CodeQL on Release configuration to avoid slowing down Debug by 4x and uploading duplicate alerts
    - name: Run CodeQL Analysis (Init)
      if: matrix.configuration == 'Release'
      uses: github/codeql-action/init@v4
      with:
        languages: cpp

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Generate Dummy Models
      shell: pwsh
      run: |
        pip install onnx
        if (-not (Test-Path models)) { mkdir models }
        python generate_dummy_onnx.py
        Copy-Item models/dummy.onnx models/depth_inpainter.onnx
        Copy-Item models/dummy_ui.onnx models/ui_synthesizer.onnx

    - name: Configure CMake
      run: cmake -B build -S . -A x64 -DDXC_EXECUTABLE="${{ github.workspace }}/dxc/bin/x64/dxc.exe" -DBUILD_TESTS=ON

    - name: Build
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        cmake --build build --config ${{ matrix.configuration }} -- /maxcpucount
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed!"
          exit 1
        }

    # Run Cppcheck once (on Release) so it doesn't run redundantly twice across matrix jobs
    - name: Run Cppcheck Static Analysis
      if: matrix.configuration == 'Release'
      shell: pwsh
      run: |
        $cppcheckVer = "2.14.0"
        $expectedSha = "DF27B2346D941D7C502B3A95B10FFB0DFF9E06B6063F5C282452FADD8A78F54B"
        $zipUrl = "https://github.com/danmar/cppcheck/releases/download/$cppcheckVer/cppcheck-$cppcheckVer-x64-Setup.msi"
        $installDir = "$env:RUNNER_TEMP\cppcheck"
        $msiPath = "$env:RUNNER_TEMP\cppcheck.msi"

        Write-Host "Installing cppcheck $cppcheckVer (SHA-256 verified)..."
        Invoke-WebRequest -Uri $zipUrl -OutFile $msiPath -ErrorAction Stop
        $actualSha = (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash.ToUpperInvariant()
        if ($actualSha -ne $expectedSha) {
          Remove-Item -LiteralPath $msiPath -Force -ErrorAction SilentlyContinue
          throw "Cppcheck MSI SHA-256 mismatch! Expected $expectedSha, got $actualSha"
        }
        Start-Process msiexec.exe -ArgumentList "/i", $msiPath, "/qn", "INSTALLDIR=$installDir" -Wait -NoNewWindow

        $cppcheckExe = "$installDir\cppcheck.exe"
        if (-not (Test-Path -LiteralPath $cppcheckExe)) {
          Write-Host "::warning::Cppcheck MSI installation did not produce cppcheck.exe; skipping non-fatal cppcheck."
          exit 0
        }

        Write-Host "Running cppcheck..."
        & $cppcheckExe --enable=warning,performance `
          --suppress=missingIncludeSystem `
          --suppress=unmatchedSuppression `
          --suppress=missingInclude `
          --suppress=cstyleCast `
          --suppress=toomanyconfigs `
          --suppress=normalCheckLevelMaxBranches `
          --inline-suppr `
          -I stereix-client/src -I nexvr-client/src -I src `
          $(if (Test-Path stereix-client/src) { "stereix-client/src/" } elseif (Test-Path nexvr-client/src) { "nexvr-client/src/" } else { "src/" }) 2>&1
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          Write-Host "::warning::Cppcheck exited with code $code (non-fatal, CodeQL is primary analyzer)"
        }
        exit 0

    - name: Verify Embedded DLL Hash Integrity (CRIT-03)
      if: matrix.configuration == 'Release'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $dll = 'build/bin/vrinject.dll'
        $cli = 'build/bin/vr-inject-cli.exe'
        $dllHash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToUpperInvariant()
        $cliImage = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $cli).Path)
        if (-not [Text.Encoding]::Unicode.GetString($cliImage).Contains($dllHash)) {
          throw "FATAL CRIT-03: build/bin/vrinject.dll SHA-256 ($dllHash) does NOT match EXPECTED_DLL_HASH in build/bin/vr-inject-cli.exe!"
        }
        Write-Host "[OK] Verified build/bin/vrinject.dll SHA-256 matches CLI embedded hash."

    - name: CodeQL Perform Analysis
      if: matrix.configuration == 'Release'
      uses: github/codeql-action/analyze@v4
      continue-on-error: true
      with:
        category: "/language:cpp"

    - name: Run Coupling Ratchets
      shell: pwsh
      run: |
        ./scripts/check_coupling.ps1

    - name: Run Tests
      shell: pwsh
      working-directory: build
      run: |
        $ErrorActionPreference = 'Continue'
        ctest -C ${{ matrix.configuration }} --output-on-failure --timeout 180 --output-junit TestResults.xml
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: test-results-${{ matrix.configuration }}
        path: |
          build/TestResults.xml
          **/TestResult*.xml
          **/test_results*.xml
          **/TEST-*.xml
        retention-days: 7

    - name: Setup Node.js for Full Suite Verification
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          stereix-client/launcher/package-lock.json
          stereix-backend/package-lock.json

    - name: Run Launcher CI Checks
      working-directory: stereix-client/launcher
      run: |
        npm ci
        npm run test:ci

    - name: Run Backend Test Suite
      working-directory: stereix-backend
      env:
        NODE_ENV: test
        JWT_SECRET: ci-test-jwt-secret-key-minimum-32-chars-0123456789
      run: |
        npm ci
        npx prisma generate
        npm run lint
        npm test

    # Export compiled engine binaries from Release configuration so testers and the release job can reuse them
    - name: Upload Release Engine Binaries
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: test-ai-binaries
        path: |
          build/bin/vrinject.dll
          build/bin/vr-inject-cli.exe
          build/bin/onnxruntime.dll
          build/bin/DirectML.dll
          build/bin/proxy/dxgi.dll
          build/bin/proxy/d3d11.dll
          build/bin/shaders
        retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Download Pre-compiled Engine Binaries
      uses: actions/download-artifact@v4
      with:
        name: test-ai-binaries
        path: build/bin

    - name: Decode Release Signing Certificate
      shell: pwsh
      env:
        CERT_BASE64: ${{ secrets.SIGN_CERT_PATH }}
        CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASS }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
          throw "SIGN_CERT_PATH and SIGN_CERT_PASS secrets are required for tagged releases (ephemeral post-link certs break EXPECTED_DLL_HASH)."
        }
        $certPath = Join-Path $env:RUNNER_TEMP 'stereix-signing.pfx'
        try {
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_BASE64))
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certPath, $env:CERT_PASSWORD)
          $eku = $cert.Extensions | Where-Object { $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } | Select-Object -First 1
          if (-not $cert.HasPrivateKey -or (Get-Date) -lt $cert.NotBefore -or (Get-Date) -gt $cert.NotAfter -or
              -not $eku -or -not @($eku.EnhancedKeyUsages | Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' }).Count) {
            throw "Invalid code-signing certificate."
          }
        } catch {
          Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
          throw "Release signing certificate is invalid or cannot be decoded."
        }
        "SIGN_CERT_PATH=$certPath" >> $env:GITHUB_ENV
        "SIGN_CERT_PASS=$env:CERT_PASSWORD" >> $env:GITHUB_ENV

    - name: Verify Signed Engine Binaries (CRIT-03 Pre-Hash Preserved)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $dll = 'build/bin/vrinject.dll'
        $cli = 'build/bin/vr-inject-cli.exe'
        if (-not (Test-Path -LiteralPath $dll) -or -not (Test-Path -LiteralPath $cli)) {
          throw "Missing required native engine binaries ($dll / $cli)."
        }
        # NEVER re-sign vrinject.dll post-link (that mutates SHA-256 and triggers CLI Exit 14).
        # vrinject.dll MUST already have been signed during build-and-test BEFORE expected_hash.h generation.
        $dllSig = Get-AuthenticodeSignature -LiteralPath $dll
        if ($dllSig.Status -ne 'Valid') {
          throw "vrinject.dll is not validly Authenticode-signed from build-and-test (status: $($dllSig.Status))."
        }
        $cliSig = Get-AuthenticodeSignature -LiteralPath $cli
        if ($cliSig.Status -ne 'Valid') {
          throw "vr-inject-cli.exe is not validly Authenticode-signed from build-and-test (status: $($cliSig.Status))."
        }
        # Hard CI gate: signed DLL SHA-256 MUST match UTF-16LE EXPECTED_DLL_HASH embedded in vr-inject-cli.exe
        $dllHash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToUpperInvariant()
        $cliImage = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $cli).Path)
        if (-not [Text.Encoding]::Unicode.GetString($cliImage).Contains($dllHash)) {
          throw "FATAL CRIT-03: Signed vrinject.dll SHA-256 ($dllHash) does NOT match EXPECTED_DLL_HASH embedded in vr-inject-cli.exe!"
        }
        Write-Host "[OK] Signed vrinject.dll SHA-256 matches CLI embedded UTF-16LE hash."

    - name: Verify Production Model Weights
      shell: pwsh
      env:
        RELEASE_MODELS_SHA256: ${{ secrets.RELEASE_MODELS_SHA256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $clientDir = if (Test-Path 'stereix-client') { 'stereix-client' } else { 'nexvr-client' }
        $modelDir = "$clientDir/models"
        if ([string]::IsNullOrWhiteSpace($env:RELEASE_MODELS_SHA256)) {
          throw "RELEASE_MODELS_SHA256 secret is required for tagged releases (dummy ONNX models cannot be shipped)."
        }
        try {
          $expected = ConvertFrom-Json -InputObject $env:RELEASE_MODELS_SHA256 -AsHashtable -ErrorAction Stop
        } catch {
          throw "Release model hashes must be a JSON object of relative filenames to SHA-256 digests."
        }
        if ($expected -isnot [System.Collections.IDictionary] -or $expected.Count -eq 0) {
          throw "Release model hash manifest is empty or invalid."
        }
        foreach ($name in @('depth_inpainter.onnx', 'ui_synthesizer.onnx')) {
          if (-not $expected.ContainsKey($name)) { throw "Missing approved model hash: $name" }
        }
        $resolvedModelDir = (Resolve-Path -LiteralPath $modelDir).Path
        $files = @(Get-ChildItem -LiteralPath $resolvedModelDir -File -Recurse | Where-Object { $_.Name -match '\.onnx(\.data)?$' })
        if ($files.Count -ne $expected.Count) { throw "Every packaged ONNX model must have an approved hash." }
        foreach ($file in $files) {
          $name = [IO.Path]::GetRelativePath($resolvedModelDir, $file.FullName).Replace('\', '/')
          if ($name -match '(^|/)dummy(_ui)?\.onnx$' -or -not $expected.ContainsKey($name) -or
              $expected[$name] -notmatch '^[A-Fa-f0-9]{64}$' -or
              (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash -ne $expected[$name]) {
            throw "Unapproved or missing production model weight: $name"
          }
          if ([Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($file.FullName)) -match
              'dummy_generator|dummy_model|dummy_graph|dummy_add|version https://git-lfs.github.com/spec/v1') {
            throw "Dummy model or Git LFS pointer cannot be released: $name"
          }
        }

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'stereix-client/launcher/package-lock.json'

    - name: Install Launcher Dependencies
      working-directory: ./stereix-client/launcher
      run: npm ci

    - name: Link Build Output for Launcher Packaging
      shell: pwsh
      run: |
        if (-not (Test-Path stereix-client/build)) {
          cmd /c mklink /J "stereix-client\build" "build"
        }

    - name: Build and Package Electron App
      working-directory: ./stereix-client/launcher
      # This triggers vite build, tsc, and electron-builder
      run: npm run pack

    - name: Verify Packaged Launcher Signatures
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $cert = if ($env:SIGN_CERT_PATH -and (Test-Path $env:SIGN_CERT_PATH)) {
          [Security.Cryptography.X509Certificates.X509Certificate2]::new($env:SIGN_CERT_PATH, $env:SIGN_CERT_PASS)
        } else { $null }
        foreach ($pattern in @('Stereix-Engine-Setup-*.exe', 'Stereix-Engine-Portable-*.exe')) {
          $distDir = 'stereix-client/launcher/dist-electron'
          $files = @(Get-ChildItem -LiteralPath $distDir -Filter $pattern -File)
          if ($files.Count -eq 0) {
            # Check fallback to legacy prefix if stereix wasn't produced
            $legacyPattern = $pattern -replace '^Stereix-', 'NexVR-'
            $files = @(Get-ChildItem -LiteralPath $distDir -Filter $legacyPattern -File)
          }
          if ($files.Count -eq 0) { throw "Missing packaged launcher: $pattern" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -and $cert) {
              try {
                Set-AuthenticodeSignature -FilePath $file.FullName -Certificate $cert -HashAlgorithm SHA256 | Out-Null
              } catch {
                Write-Host "::warning::Could not sign $($file.Name): $_"
              }
            }
          }
        }

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: stereix-engine-installer
        path: |
          stereix-client/launcher/dist-electron/*-Engine-Setup-*.exe
          stereix-client/launcher/dist-electron/*-Engine-Portable-*.exe

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          stereix-client/launcher/dist-electron/*-Engine-Setup-*.exe
          stereix-client/launcher/dist-electron/*-Engine-Portable-*.exe