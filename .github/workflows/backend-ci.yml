name: Backend CI & Docker Build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'stereix-backend/**'
      - 'stereix-deployment/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'stereix-backend/**'
      - 'stereix-deployment/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test, Lint, and Build TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'stereix-backend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./stereix-backend
        run: npm ci

      - name: Prisma Generate
        working-directory: ./stereix-backend
        run: npx prisma generate

      - name: Typecheck / Lint
        working-directory: ./stereix-backend
        run: npm run lint

      - name: Compile TypeScript
        working-directory: ./stereix-backend
        run: npm run build

      - name: Run Backend Unit Tests
        working-directory: ./stereix-backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-key-minimum-32-chars-0123456789
        run: npm test

  docker-build:
    name: Build and Scan Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./stereix-backend
          file: ./stereix-backend/Dockerfile
          push: false
          tags: stereix-backend:test
          load: true
